<a
  href="#main"
  class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 focus:rounded-control focus:bg-accent focus:px-4 focus:py-2 focus:font-medium focus:text-on-accent"
  (click)="skipToContent($event)"
>
  Skip to main content
</a>

<div class="min-h-dvh md:flex">
  <app-sidebar [focusLayout]="focusLayout()" />

  <div class="flex min-w-0 flex-1 flex-col">
    <app-top-bar [period]="period()" [showAdd]="showAddSpending()" [focusLayout]="focusLayout()" />
    <main #main id="main" tabindex="-1" [class]="mainClass()">
      <!-- The sidebar has the notice on a wide screen; a phone has no sidebar. -->
      <app-update-notice class="md:hidden" />
      @if (starting()) {
        <app-loading-state label="Loading Wallet…" />
      }
      <router-outlet />
      @if (showAddSpending()) {
        <app-add-spending-fab />
      }
    </main>
  </div>
</div>

@if (!focusLayout()) {
  <app-tab-bar />
}
<app-toast-container [aboveTabBar]="!focusLayout()" />
<app-confirm-dialog />
<!-- The form and what it needs stay out of the first download: they load, ahead of time when the browser
     is idle, and no later than the first press of "Add spending". -->
@defer (when addSpending.isOpen(); prefetch on idle) {
  @if (addSpending.isOpen()) {
    <app-add-spending-dialog />
  }
}
