<app-page width="narrow">
  <app-page-header
    title="Income"
    [subtitle]="monthLabel() ? 'Salary and other money coming in, for ' + monthLabel() + '.' : ''"
  />

  @if (month(); as month) {
    <app-async-section
      variant="plain"
      [heading]="'Income in ' + monthLabel()"
      [description]="monthNote()"
      [state]="viewState()"
      [error]="view.error()"
      loadingLabel="Loading this month's income…"
      errorTitle="Couldn't load this month's income"
      (retry)="view.reload()"
    >
      @if (monthView(); as view) {
        <app-month-status sectionAction [status]="view.status" />
      }
      @if (monthView(); as view) {
        <dl appStatGrid [columns]="3">
          <div appStat label="Salary" [cents]="view.income.salary"></div>
          <div appStat label="One-off income" [cents]="view.income.extra"></div>
          <div appStat size="lg" label="Total income" [cents]="view.income.total"></div>
        </dl>
      }
    </app-async-section>

    @switch (salaryState()) {
      @case ('loading') {
        <app-loading-state label="Loading the salary history…" />
      }
      @case ('error') {
        <app-error-state
          title="Couldn't load the salary history"
          [error]="salary.error()"
          (retry)="salary.reload()"
        />
      }
      @default {
        @if (salaryEntries(); as entries) {
          <app-salary-section
            [month]="month"
            [entries]="entries"
            [salary]="monthView()?.income?.salary"
            (changed)="reload()"
          />
        }
      }
    }

    <app-incomes-section
      [month]="month"
      [incomes]="incomeList()"
      [state]="incomesState()"
      [error]="incomes.error()"
      (retry)="incomes.reload()"
      (changed)="reload()"
    />
  }
</app-page>
