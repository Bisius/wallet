<section role="search" aria-label="Search and filter spendings" class="space-y-4">
  <div [formGroup]="form" class="flex flex-wrap items-end gap-x-2 gap-y-3">
    <app-field class="min-w-0 flex-1 basis-40" label="Search" [labelHidden]="true">
      <input
        appInput
        type="search"
        formControlName="q"
        autocomplete="off"
        enterkeyhint="search"
        placeholder="Description or notes"
        [attr.maxlength]="searchMaxLength"
        (keydown.enter)="applyNow($event)"
      />
    </app-field>

    <button
      type="button"
      appButton
      variant="secondary"
      [attr.aria-label]="filtersLabel()"
      [attr.aria-expanded]="open()"
      [attr.aria-controls]="panelId"
      (click)="toggle()"
    >
      <app-icon name="filter" />
      Filters
      @if (count() > 0) {
        <app-badge tone="accent" aria-hidden="true">{{ count() }}</app-badge>
      }
      <app-icon [name]="open() ? 'chevron-up' : 'chevron-down'" />
    </button>

    @if (count() > 0) {
      <button type="button" appButton variant="ghost" (click)="clear.emit()">Clear filters</button>
    }
  </div>

  <div
    [id]="panelId"
    [formGroup]="form"
    [class]="open() ? 'grid gap-4 border-t border-line pt-4 sm:grid-cols-2' : 'hidden'"
  >
    <app-segmented
      class="sm:col-span-2"
      legend="Show spendings from"
      [options]="scopeOptions()"
      [value]="filters().allMonths ? 'all' : 'month'"
      (valueChange)="setScope($event === 'all')"
    />

    <app-field label="Filter by budget">
      <select appInput (change)="onBudget($event)">
        <option value="" [selected]="filters().budgetId === null">All budgets</option>
        @for (budget of budgets(); track budget.id) {
          <option [value]="budget.id" [selected]="filters().budgetId === budget.id">
            {{ budget.name }}
          </option>
        }
      </select>
    </app-field>

    <app-field label="Filter by tag">
      <select appInput (change)="onTag($event)">
        <option value="" [selected]="filters().tagId === null">All tags</option>
        @for (tag of tagOptions(); track tag.id) {
          <option [value]="tag.id" [selected]="filters().tagId === tag.id">{{ tag.name }}</option>
        }
      </select>
    </app-field>

    <app-field label="Minimum amount" hint="Refunds are negative.">
      <app-money-input formControlName="minAmount" keyboard="text" />
    </app-field>

    <app-field
      label="Maximum amount"
      hint="Refunds are negative."
      [error]="rangeError() ?? undefined"
    >
      <app-money-input formControlName="maxAmount" keyboard="text" />
    </app-field>
  </div>
</section>
