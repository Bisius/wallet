<!--
  The fields are written once, as templates, because the form has two shapes: the quick add of the
  Spendings page (compact: amount, budget and date on a line, the rest under "More") and the form of a
  dialog (the edit dialog, the shell's Add spending), which shows every field as it always did. The
  templates are inside the form because a control looks for its `formGroup` where its template is
  declared, not where it is shown.
-->
<form [formGroup]="form" (ngSubmit)="save()" novalidate class="space-y-4">
  <ng-template #amountTpl>
    <app-field #amountField label="Amount">
      <app-money-input formControlName="amount" />
    </app-field>
  </ng-template>

  <ng-template #budgetTpl>
    <app-field label="Budget">
      <select appInput formControlName="budgetId">
        @for (line of budgets(); track line.id) {
          <option [value]="line.id">
            {{ line.name }} ·
            @if (line.remaining < 0) {
              over by {{ -line.remaining | money }}
            } @else {
              {{ line.remaining | money }} left
            }
          </option>
        }
      </select>
    </app-field>
  </ng-template>

  <ng-template #dateTpl>
    <app-field label="Date">
      <input
        appInput
        type="date"
        formControlName="date"
        [attr.min]="firstDay()"
        [attr.max]="lastDay()"
      />
    </app-field>
  </ng-template>

  <ng-template #descriptionTpl>
    <app-field label="Description" [optional]="true">
      <input
        appInput
        formControlName="description"
        autocomplete="off"
        [attr.maxlength]="descriptionMaxLength"
      />
    </app-field>
  </ng-template>

  <ng-template #tagsTpl>
    <app-field
      label="Tags"
      [optional]="true"
      hint="Labels to find this spending by later. They change no budget or balance."
    >
      <app-tag-input formControlName="tagIds" />
    </app-field>
  </ng-template>

  <ng-template #refundTpl>
    <app-toggle
      formControlName="refund"
      kind="checkbox"
      label="Refund"
      hint="Money coming back into the budget, such as a returned item."
    />
  </ng-template>

  @if (compact()) {
    <div class="flex flex-wrap items-start gap-x-3 gap-y-4">
      <div class="basis-32 grow">
        <ng-container [ngTemplateOutlet]="amountTpl" />
      </div>
      <div class="basis-56 grow-2">
        <ng-container [ngTemplateOutlet]="budgetTpl" />
      </div>
      <div class="basis-40 grow">
        <ng-container [ngTemplateOutlet]="dateTpl" />
      </div>
    </div>

    <app-disclosure summary="More" [(open)]="moreOpen">
      <span class="sr-only" disclosureSummary>: description, tags and refund</span>
      <div class="space-y-4">
        <div class="flex flex-wrap items-start gap-x-3 gap-y-4">
          <div class="basis-56 grow">
            <ng-container [ngTemplateOutlet]="descriptionTpl" />
          </div>
          <div class="basis-56 grow">
            <ng-container [ngTemplateOutlet]="tagsTpl" />
          </div>
        </div>
        <ng-container [ngTemplateOutlet]="refundTpl" />
      </div>
    </app-disclosure>
  } @else {
    <div class="grid gap-4 sm:grid-cols-2">
      <ng-container [ngTemplateOutlet]="amountTpl" />
      <ng-container [ngTemplateOutlet]="budgetTpl" />
    </div>

    <ng-container [ngTemplateOutlet]="refundTpl" />

    <div class="grid gap-4 sm:grid-cols-2">
      <ng-container [ngTemplateOutlet]="dateTpl" />
      <ng-container [ngTemplateOutlet]="descriptionTpl" />
    </div>

    @if (spending()) {
      <app-field label="Notes" [optional]="true">
        <textarea
          appInput
          formControlName="notes"
          rows="3"
          [attr.maxlength]="notesMaxLength"
        ></textarea>
      </app-field>
    }

    @if (spending() || tagsOpen()) {
      <ng-container [ngTemplateOutlet]="tagsTpl" />
    } @else {
      <button type="button" appButton variant="ghost" size="sm" (click)="revealTags()">
        <app-icon name="tag" />
        Add tags
      </button>
    }
  }

  @if (formError(); as error) {
    <app-alert tone="error">{{ error }}</app-alert>
  }

  <div
    [class]="dialogFooter() ? 'dialog-footer' : 'flex flex-col gap-2 sm:flex-row sm:justify-end'"
  >
    @if (dialogFooter()) {
      <button appButton variant="secondary" [disabled]="saving()" (click)="cancelled.emit()">
        Cancel
      </button>
    }
    <button appButton type="submit" [loading]="saving()">
      {{ spending() ? 'Save changes' : isRefund() ? 'Add refund' : 'Add spending' }}
    </button>
  </div>
</form>
