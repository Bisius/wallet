<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Wallet</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- One tag, no media query: a query would follow the operating system and ignore the theme chosen
         in Settings. theme-init.js sets the colour of the effective theme before the first paint and
         ThemeService keeps it in step afterwards. -->
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180x180.png" />
    <script src="theme-init.js"></script>
  </head>
  <body class="bg-canvas text-ink antialiased">
    <app-root></app-root>
  </body>
</html>
